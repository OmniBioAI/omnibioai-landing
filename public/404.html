<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04080f;--bg2:#080e1a;--accent:#00d4aa;--text:#e8f0fe;--text-muted:#7a9bbf;--text-dim:#6b8bb0;--border:rgba(0,212,170,0.12);--border2:rgba(0,212,170,0.25)}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
nav{display:flex;align-items:center;padding:0 3rem;height:64px;border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.nav-logo-img{display:block;width:auto;height:22px;filter:drop-shadow(0 0 8px rgba(0,212,170,0.35))}
.nav-version{font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:var(--text-dim);font-weight:300}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:6rem 2rem 5rem}
.code{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--accent);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.75rem;display:block}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,2.8rem);line-height:1.15;margin-bottom:1rem}
p{color:var(--text-muted);font-weight:300;margin-bottom:2rem}
.links{display:flex;flex-wrap:wrap;gap:0.75rem;list-style:none}
.links a{display:inline-block;padding:0.6rem 1.2rem;border:1px solid var(--border2);border-radius:3px;color:var(--text);text-decoration:none;font-size:0.9rem}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.links a.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
footer{border-top:1px solid var(--border);padding:1.5rem 3rem;background:var(--bg2);font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text-dim)}
@media(max-width:700px){nav,footer{padding-left:1.25rem;padding-right:1.25rem}main{padding:4rem 1.25rem}}
</style>
