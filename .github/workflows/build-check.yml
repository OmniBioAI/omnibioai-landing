name: Build check

# public/index.html is generated from src/ and committed, because Cloudflare
# Pages publishes public/ as-is with no build command. Fail when the committed
# page does not match what the sources build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: public/index.html matches src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare with the committed page
        run: git diff --exit-code -- public/index.html || { echo "::error::public/index.html is out of date. Edit src/, run 'npm run build' and commit the result."; exit 1; }
